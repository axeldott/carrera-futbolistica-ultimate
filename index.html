<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fichas: Carrera de Fútbol</title>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --gold: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    #game-container {
      width: 100%;
      max-width: 760px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1, h2, h3 { color: #ffffff; margin-bottom: 14px; font-weight: 800; }
    h1 { font-size: 1.8rem; text-align: center; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.15rem; color: var(--accent); }

    p { line-height: 1.6; margin-bottom: 12px; color: var(--text-main); }
    hr { border: 0; border-top: 1px solid var(--border-color); margin: 20px 0; }

    .tarjeta-ficha {
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .ficha-juvenil {
      background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
      border: 1px solid #38bdf8;
    }

    .ficha-prime {
      background: linear-gradient(135deg, #14532d 0%, #16a34a 100%);
      border: 1px solid #4ade80;
    }

    .ficha-veterano {
      background: linear-gradient(135deg, #78350f 0%, #d97706 100%);
      border: 1px solid #fbbf24;
    }

    .badge-etapa {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .finanzas-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 8px;
      font-size: 0.88rem;
    }

    .progreso-carrera {
      display: flex;
      gap: 3px;
      margin-top: 10px;
    }

    .progreso-bloque {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .progreso-bloque.activo {
      background: #ffffff;
    }

    /* ESTILOS DE CARTA ULTIMATE TEAM */
    .fut-card-wrapper {
      display: flex;
      justify-content: center;
      margin: 24px 0;
    }

    .fut-card {
      width: 300px;
      background: linear-gradient(160deg, #f3e08f 0%, #d4af37 45%, #aa8218 100%);
      color: #2b2105;
      border-radius: 22px 22px 45px 45px;
      border: 4px solid #fef08a;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.65), inset 0 0 20px rgba(255, 255, 255, 0.5);
      padding: 18px 20px 22px 20px;
      position: relative;
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      text-transform: uppercase;
      user-select: none;
    }

    .fut-card.fut-icon {
      background: linear-gradient(160deg, #ffffff 0%, #f5ebd6 40%, #d8c088 100%);
      border-color: #eab308;
      color: #3b2d0b;
    }

    .fut-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(43, 33, 5, 0.25);
      padding-bottom: 12px;
      margin-bottom: 10px;
    }

    .fut-left-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 92px;
      border-right: 1px solid rgba(43, 33, 5, 0.2);
      padding-right: 8px;
    }

    .fut-rating {
      font-size: 3.1rem;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -1px;
    }

    .fut-pos {
      font-size: 1.25rem;
      font-weight: 800;
      margin-top: 2px;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(43, 33, 5, 0.25);
      width: 100%;
      text-align: center;
    }

    .fut-flag {
      font-size: 1.65rem;
      line-height: 1.1;
      margin-top: 6px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    }

    .fut-league-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 0.65rem;
      font-weight: 800;
      margin-top: 5px;
      padding: 2px 5px;
      border-top: 1px solid rgba(43, 33, 5, 0.2);
      border-bottom: 1px solid rgba(43, 33, 5, 0.2);
      width: 100%;
      text-align: center;
    }

    .fut-club-crest {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 5px;
      text-align: center;
    }

    .fut-club-icon {
      font-size: 1.15rem;
      line-height: 1;
    }

    .fut-club-name {
      font-size: 0.68rem;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 2px;
    }

    .fut-right-avatar {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-left: 10px;
    }

    .fut-silhouette-svg {
      width: 115px;
      height: 115px;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,0.35));
    }

    .fut-prime-tag {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: #2b2105;
      color: #facc15;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
    }

    .fut-name {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      border-bottom: 2px solid rgba(43, 33, 5, 0.25);
      padding-bottom: 6px;
      margin-bottom: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fut-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 16px;
      position: relative;
      padding: 0 6px;
    }

    .fut-stats-grid::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 4%;
      bottom: 4%;
      width: 1px;
      background: rgba(43, 33, 5, 0.3);
    }

    .fut-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 1px 4px;
    }

    .fut-stat-val {
      font-weight: 900;
    }

    .fut-stat-lbl {
      font-weight: 700;
      opacity: 0.85;
    }

    .fut-footer-line {
      width: 45px;
      height: 3px;
      background: rgba(43, 33, 5, 0.35);
      margin: 12px auto 0 auto;
      border-radius: 2px;
    }

    .cartel {
      border-radius: 8px;
      padding: 14px 18px;
      margin: 15px 0;
      border-left: 6px solid;
    }

    .cartel-titular {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .cartel-cuerpo {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .cartel-stats {
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 14px;
      border-radius: 6px;
      line-height: 1.6;
    }

    .cartel-oro {
      background: rgba(234, 179, 8, 0.15);
      border-color: #eab308;
      color: #fef08a;
    }

    .cartel-verde {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      color: #bbf7d0;
    }

    .cartel-azul {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #bfdbfe;
    }

    .cartel-rojo {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fecaca;
    }

    .cartel-moral {
      background: rgba(168, 85, 247, 0.15);
      border-left: 5px solid #a855f7;
      color: #e9d5ff;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 10px 0;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .cartel-fisico {
      background: rgba(14, 165, 233, 0.15);
      border-left: 5px solid #0ea5e9;
      color: #bae6fd;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 10px 0;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .cartel-torneo-sel {
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.5) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid #38bdf8;
      border-left: 6px solid #facc15;
      border-radius: 8px;
      padding: 14px 18px;
      margin: 12px 0;
      line-height: 1.6;
      color: #f8fafc;
    }

    .cartel-retiro {
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.25) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #ef4444;
      color: #fecaca;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;
    }

    .cartel-forzado {
      background: linear-gradient(135deg, rgba(185, 28, 28, 0.3) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #dc2626;
      color: #fca5a5;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;
    }

    .cartel-fifa {
      background: linear-gradient(135deg, #0284c7 0%, #1e1b4b 100%);
      border-left: 5px solid #38bdf8;
      color: #e0f2fe;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;
    }

    .cartel-noticia {
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      border: 2px solid #e11d48;
      border-radius: 10px;
      padding: 16px 18px;
      margin: 15px 0;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.2);
    }

    .badge-prensa {
      display: inline-block;
      background: #e11d48;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 2px 7px;
      border-radius: 3px;
      margin-bottom: 8px;
    }

    .oferta-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .oferta-header {
      font-weight: 800;
      font-size: 1.05rem;
      color: #38bdf8;
      margin-bottom: 6px;
    }

    .oferta-detalles {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .lista-opciones {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0;
    }

    button.btn-opcion {
      background-color: #1e3a8a;
      color: #ffffff;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 12px 16px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.btn-opcion:hover {
      background-color: #2563eb;
      transform: translateY(-1px);
    }

    button.btn-opcion-retiro {
      background-color: #7f1d1d;
      border-color: #ef4444;
      color: #fecaca;
    }

    button.btn-opcion-retiro:hover {
      background-color: #991b1b;
    }

    button.btn-primario {
      background-color: #0284c7;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
      width: 100%;
      text-align: center;
      font-size: 1rem;
    }

    button.btn-primario:hover {
      background-color: #0369a1;
    }

    button.btn-compartir {
      background-color: #16a34a;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
      width: 100%;
      text-align: center;
      font-size: 1rem;
      transition: background-color 0.2s;
    }

    button.btn-compartir:hover {
      background-color: #15803d;
    }

    input[type="text"] {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      margin: 6px 0 16px 0;
    }

    .vitrina-box {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid #eab308;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
    }

    .seleccion-box {
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid #3b82f6;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
    }

    .premios-box {
      background: linear-gradient(135deg, #451a03 0%, #78350f 100%);
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 14px;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    const banderasPaises = {
      "España": "🇪🇸", "Francia": "🇫🇷", "Alemania": "🇩🇪", "Inglaterra": "🏴󠁧󠁢󠁥󠁮󠁧󠁿", "Italia": "🇮🇹", "Argentina": "🇦🇷", "Brasil": "🇧🇷",
      "Portugal": "🇵🇹", "Países Bajos": "🇳🇱", "Uruguay": "🇺🇾", "Croacia": "🇭🇷", "Bélgica": "🇧🇪", "Colombia": "🇨🇴",
      "Marruecos": "🇲🇦", "Senegal": "🇸🇳", "México": "🇲🇽", "Estados Unidos": "🇺🇸", "Japón": "🇯🇵", "Chile": "🇨🇱", "Ecuador": "🇪🇨", "Polonia": "🇵🇱", "Turquía": "🇹🇷",
      "Nigeria": "🇳🇬", "Costa de Marfil": "🇨🇮", "Camerún": "🇨🇲", "Egipto": "🇪🇬", "Ghana": "🇬🇭", "Grecia": "🇬🇷", "Noruega": "🇳🇴", "Corea del Sur": "🇰🇷", "Australia": "🇦🇺", "Paraguay": "🇵🇾", "Perú": "🇵🇪",
      "Islandia": "🇮🇸", "Bolivia": "🇧🇴", "Venezuela": "🇻🇪", "Costa Rica": "🇨🇷", "Jamaica": "🇯🇲", "Honduras": "🇭🇳", "Panamá": "🇵🇦", "Argelia": "🇩🇿", "Mali": "🇲🇱", "Irán": "🇮🇷", "Catar": "🇶🇦", "Nueva Zelanda": "🇳🇿"
    };

    const tier1 = ["España", "Francia", "Alemania", "Inglaterra", "Italia", "Argentina", "Brasil"];
    const tier2 = ["Portugal", "Países Bajos", "Uruguay", "Croacia", "Bélgica", "Colombia"];
    const tier3 = ["Marruecos", "Senegal", "México", "Estados Unidos", "Japón", "Chile", "Ecuador", "Polonia", "Turquía"];
    const tier4 = ["Nigeria", "Costa de Marfil", "Camerún", "Egipto", "Ghana", "Grecia", "Noruega", "Corea del Sur", "Australia", "Paraguay", "Perú"];
    const tier5 = ["Islandia", "Bolivia", "Venezuela", "Costa Rica", "Jamaica", "Honduras", "Panamá", "Argelia", "Mali", "Irán", "Catar", "Nueva Zelanda"];

    const paisesMundo = [...tier1, ...tier2, ...tier3, ...tier4, ...tier5];

    function obtenerTierPais(pais) {
      if (tier1.includes(pais)) return { tier: 1, minMediaSel: 73, probCont: 52, probMun: 38, probRes: 30, reqCont: 76, reqMun: 80 };
      if (tier2.includes(pais)) return { tier: 2, minMediaSel: 73, probCont: 38, probMun: 24, probRes: 20, reqCont: 78, reqMun: 82 };
      if (tier3.includes(pais)) return { tier: 3, minMediaSel: 72, probCont: 24, probMun: 12, probRes: 12, reqCont: 80, reqMun: 84 };
      if (tier4.includes(pais)) return { tier: 4, minMediaSel: 70, probCont: 14, probMun: 6, probRes: 6, reqCont: 82, reqMun: 86 };
      return { tier: 5, minMediaSel: 68, probCont: 8, probMun: 3, probRes: 3, reqCont: 84, reqMun: 88 };
    }

    function obtenerNombreTorneoContinental(pais) {
      const europa = ["España", "Francia", "Alemania", "Inglaterra", "Italia", "Portugal", "Países Bajos", "Croacia", "Bélgica", "Polonia", "Turquía", "Grecia", "Noruega", "Islandia"];
      const sudamerica = ["Argentina", "Brasil", "Uruguay", "Colombia", "Chile", "Ecuador", "Paraguay", "Perú", "Bolivia", "Venezuela"];
      const africa = ["Marruecos", "Senegal", "Nigeria", "Costa de Marfil", "Camerún", "Egipto", "Ghana", "Argelia", "Mali"];
      const asia = ["Japón", "Corea del Sur", "Australia", "Irán", "Catar"];
      const concacaf = ["México", "Estados Unidos", "Costa Rica", "Jamaica", "Honduras", "Panamá"];

      if (europa.includes(pais)) return "UEFA Euro";
      if (sudamerica.includes(pais)) return "CONMEBOL Copa América";
      if (africa.includes(pais)) return "Copa Africana de Naciones";
      if (asia.includes(pais)) return "Copa Asiática de la AFC";
      if (concacaf.includes(pais)) return "Copa Oro de la Concacaf";
      return "Copa de las Naciones de la OFC";
    }

    // Nombres oficiales en su idioma original
    function obtenerTitulosRealesClub(club) {
      const c = club.toLowerCase();
      if (c.includes("madrid") || c.includes("barcelona") || c.includes("athletic") || c.includes("sociedad") || c.includes("valencia") || c.includes("betis") || c.includes("villarreal") || c.includes("girona") || c.includes("celta") || c.includes("sevilla")) {
        return { liga: "La Liga", copa: "Copa del Rey", supercopa: "Supercopa de España", iconoLiga: "🇪🇸" };
      }
      if (c.includes("manchester") || c.includes("liverpool") || c.includes("arsenal") || c.includes("chelsea") || c.includes("tottenham") || c.includes("aston villa") || c.includes("newcastle") || c.includes("west ham") || c.includes("brighton") || c.includes("everton") || c.includes("wolverhampton")) {
        return { liga: "Premier League", copa: "FA Cup", supercopa: "FA Community Shield", iconoLiga: "🦁" };
      }
      if (c.includes("milan") || c.includes("inter") || c.includes("juventus") || c.includes("atalanta") || c.includes("roma") || c.includes("napoli") || c.includes("fiorentina") || c.includes("lazio")) {
        return { liga: "Serie A", copa: "Coppa Italia", supercopa: "Supercoppa Italiana", iconoLiga: "🇮🇹" };
      }
      if (c.includes("bayern") || c.includes("dortmund") || c.includes("leverkusen") || c.includes("frankfurt") || c.includes("stuttgart") || c.includes("leipzig")) {
        return { liga: "Bundesliga", copa: "DFB-Pokal", supercopa: "DFL-Supercup", iconoLiga: "🇩🇪" };
      }
      if (c.includes("paris") || c.includes("lyon") || c.includes("mónaco") || c.includes("lille")) {
        return { liga: "Ligue 1", copa: "Coupe de France", supercopa: "Trophée des Champions", iconoLiga: "🇫🇷" };
      }
      if (c.includes("benfica") || c.includes("sporting") || c.includes("porto")) {
        return { liga: "Primeira Liga", copa: "Taça de Portugal", supercopa: "Supertaça Cândido de Oliveira", iconoLiga: "🇵🇹" };
      }
      if (c.includes("ajax") || c.includes("psv") || c.includes("feyenoord")) {
        return { liga: "Eredivisie", copa: "KNVB Beker", supercopa: "Johan Cruijff Schaal", iconoLiga: "🇳🇱" };
      }
      if (c.includes("river") || c.includes("boca")) {
        return { liga: "Liga Profesional de Fútbol", copa: "Copa Argentina", supercopa: "Supercopa Argentina", iconoLiga: "🇦🇷" };
      }
      if (c.includes("santos") || c.includes("flamengo")) {
        return { liga: "Campeonato Brasileiro Série A", copa: "Copa do Brasil", supercopa: "Supercopa Rei", iconoLiga: "🇧🇷" };
      }
      if (c.includes("al-hilal") || c.includes("al-nassr")) {
        return { liga: "Roshn Saudi League", copa: "King's Cup", supercopa: "Saudi Super Cup", iconoLiga: "🇸🇦" };
      }
      if (c.includes("miami") || c.includes("galaxy")) {
        return { liga: "Major League Soccer", copa: "U.S. Open Cup", supercopa: "Supporters' Shield", iconoLiga: "🇺🇸" };
      }
      return { liga: "J1 League", copa: "Emperor's Cup", supercopa: "Japanese Super Cup", iconoLiga: "🇯🇵" };
    }

    const listaPosiciones = [

    function pickDistinct(arr, count, exclude = []) {
      const copy = arr.filter(x => !exclude.includes(x));
      const res = [];
      for (let i = 0; i < count; i++) {
        if (!copy.length) break;
        const idx = Math.floor(Math.random() * copy.length);
        res.push(copy.splice(idx, 1)[0]);
      }
      return res;
    }

    function calcularValorMercado() {
      const m = player.media;
      const e = player.edad;
      let base = 0;

      if (m < 70) base = 1 + (m - 60) * 0.4;
      else if (m < 75) base = 5 + (m - 70) * 2;
      else if (m < 80) base = 15 + (m - 75) * 4;
      else if (m < 85) base = 35 + (m - 80) * 8;
      else if (m < 90) base = 75 + (m - 85) * 15;
      else base = 150 + (m - 90) * 25;

      let factorEdad = 1.0;
      if (e <= 21) factorEdad = 1.6;
      else if (e <= 24) factorEdad = 1.4;
      else if (e <= 28) factorEdad = 1.15;
      else if (e <= 30) factorEdad = 0.9;
      else if (e <= 33) factorEdad = 0.55;
      else if (e <= 35) factorEdad = 0.3;
      else factorEdad = 0.12;

      let factorPos = 1.0;
      if (player.posicion.includes("Delantero") || player.posicion.includes("Extremo")) factorPos = 1.15;
      else if (player.posicion === "Portero") factorPos = 0.8;

      let val = Math.max(0.5, Math.round(base * factorEdad * factorPos * 10) / 10);
      player.valorMercado = val;
      if (val > player.valorMercadoRecord) {
        player.valorMercadoRecord = val;
      }

      let factorClub = clubesEuropaTop.includes(player.club) ? 1.3 : (clubesEuropaMedios.includes(player.club) ? 1.0 : 0.7);
      if (clubesExoticos.includes(player.club)) factorClub = 2.4;
      player.sueldoAnual = Math.max(0.3, Math.round((val * 0.11 * factorClub) * 10) / 10);
      player.clausulaRescision = Math.round(val * 1.5);
    }

      if (player.edad >= 30 && !player.retiradoSeleccion) {
        htmlRetiroSeleccion = `
          <div style="background: rgba(30, 58, 138, 0.25); border-left: 5px solid #38bdf8; padding: 12px 16px; margin: 15px 0; border-radius: 6px;">
            🌍 <strong>DECISIÓN INTERNACIONAL: ¿RETIRARSE DE ${player.nacionalidad.toUpperCase()}?</strong><br>
            A tus ${player.edad} años, la doble competencia desgasta tus piernas. Retirarte de tu selección nacional te permitirá descansar en fechas FIFA y evitar lesiones.
            <div class="lista-opciones" style="margin-top: 10px;">
              <button class="btn-opcion" onclick="retirarseDeSeleccion()">
                👋 <strong>Retirarte de la selección:</strong> Concentrar el 100% de tus fuerzas en el club (+1 de media y alivio físico)
              </button>
            </div>
          </div>
        `;
      }

      const etapaJuvenilMax = (player.modoJuego === 22) ? 10 : 5;
      const etapaPrimeMax = (player.modoJuego === 22) ? 15 : 7;

      if (htmlProblemaFIFA !== "") {
        htmlOpciones = htmlProblemaFIFA;
      } else if (htmlOfertaTitan !== "") {
        htmlOpciones = htmlOfertaTitan;
      } else if (player.numeroFicha === 1) {
        const offA = pickRandomExcept(clubesEuropaMedios, player.club);
        const offB = pickRandomExcept(clubesEuropaBajos, player.club);
        const detA = generarDetalleContrato(offA);
        const detB = generarDetalleContrato(offB);

        htmlOpciones = `
          <div style="background: rgba(56, 189, 248, 0.15); border-left: 4px solid #38bdf8; padding: 14px; margin: 15px 0;">
            ✈️ <strong>Tu ciclo en la academia ha terminado.</strong> Dos clubes presentan ofertas formales detalladas:
          </div>
          
          <div class="oferta-card">
            <div class="oferta-header">🏛️ Oferta de ${detA.club}</div>
            <div class="oferta-detalles">
              • <strong>Duración:</strong> ${detA.duracion} temporada(s)<br>
              • <strong>Sueldo:</strong> €${detA.sueldo}M/año | <strong>Prima:</strong> €${detA.prima}M<br>
              • <strong>Cláusula:</strong> €${detA.clausula}M | <strong>Rol:</strong> ${detA.rol}
            </div>
            <button class="btn-opcion" onclick="ejecutarDecision({club: '${detA.club}'})">Firmar por el <strong>${detA.club}</strong></button>
          </div>

          <div class="oferta-card">
            <div class="oferta-header">🏛️ Oferta de ${detB.club}</div>
            <div class="oferta-detalles">
              • <strong>Duración:</strong> ${detB.duracion} temporada(s)<br>
              • <strong>Sueldo:</strong> €${detB.sueldo}M/año | <strong>Prima:</strong> €${detB.prima}M<br>
              • <strong>Cláusula:</strong> €${detB.clausula}M | <strong>Rol:</strong> ${detB.rol}
            </div>
            <button class="btn-opcion" onclick="ejecutarDecision({club: '${detB.club}', mediaDelta: 1})">Firmar por el <strong>${detB.club}</strong> (Titularidad y +1 de media)</button>
          </div>
        `;
      } else if (player.numeroFicha <= etapaJuvenilMax && player.edad < 25) {
        const azarDilema = randomInt(1, 3);
        if (azarDilema === 1) {
          const interesado = pickRandomExcept(clubesEuropaMedios, player.club);
          const detInt = generarDetalleContrato(interesado);
          htmlOpciones = `
            <div style="background: rgba(59, 130, 246, 0.15); border-left: 4px solid #38bdf8; padding: 14px; margin: 15px 0;">
              📰 <strong>PROPUESTA FORMAL DE MERCADO</strong>
            </div>
            <div class="oferta-card">
              <div class="oferta-header">🏛️ Contrato ofrecido por ${detInt.club}</div>
              <div class="oferta-detalles">
                • <strong>Duración:</strong> ${detInt.duracion} temporada(s)<br>
                • <strong>Sueldo:</strong> €${detInt.sueldo}M/año | <strong>Prima:</strong> €${detInt.prima}M<br>
                • <strong>Cláusula:</strong> €${detInt.clausula}M | <strong>Rol:</strong> ${detInt.rol}
              </div>
              <button class="btn-opcion" onclick="ejecutarDecision({club: '${detInt.club}'})">Aceptar traspaso y mudarte al <strong>${detInt.club}</strong></button>
            </div>
            <button class="btn-opcion" onclick="ejecutarDecision({mediaDelta: 1})">Renovar contrato y seguir en el <strong>${player.club}</strong> (+1 de media)</button>
          `;
        } else {
          htmlOpciones = `
            <div style="background: rgba(16, 185, 129, 0.15); border-left: 4px solid #10b981; padding: 14px; margin: 15px 0;">
              🥗 <strong>PLAN DE NUTRICIÓN Y METABOLISMO DE ÉLITE</strong><br>
              Un nutricionista de prestigio te propone una dieta metabólica estricta. Ayuda a prevenir lesiones en el futuro.<br>
              <small style="color: #94a3b8;">(Riesgo: 70% éxito de +1 de media y blindaje físico / 30% fatiga y perder -1)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarDieta()">Aceptar el plan nutricional estricto</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Mantener tu alimentación habitual sin riesgos</button>
            </div>
          `;
        }
      } else if (player.numeroFicha <= etapaPrimeMax && player.edad < 32) {
        if (guerrasValidas.length > 0 && randomInt(1, 100) <= 60) {
          const guerra = pickRandom(guerrasValidas);
          htmlOpciones = generarHtmlGuerra(guerra);
        } else {
          htmlOpciones = `
            <div style="background: rgba(16, 185, 129, 0.15); border-left: 4px solid #10b981; padding: 14px; margin: 15px 0;">
              🥩 <strong>PLAN DE NUTRICIÓN MOLECULAR Y LONGEVIDAD</strong><br>
              Afinar tu porcentaje graso al milímetro para prolongar tu pico de rendimiento y reducir el riesgo de lesión.<br>
              <small style="color: #94a3b8;">(Riesgo: 70% éxito +1 / 30% bajón energético -1)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarDieta()">Someterte a la dieta estricta</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Seguir con tus hábitos habituales</button>
            </div>
          `;
        }
      } else {
        const azarVet = randomInt(1, 3);
        if (azarVet === 1) {
          htmlOpciones = `
            <div style="background: rgba(245, 158, 11, 0.15); border-left: 4px solid #f59e0b; padding: 14px; margin: 15px 0;">
              🌟 <strong>CAPITÁN Y MENTOR DE LA CANTERA (${player.edad} años)</strong><br>
              Ha irrumpido una joya juvenil al primer equipo. El club te pide ser su tutor en el vestuario.<br>
              <small style="color: #94a3b8;">(Riesgo: 75% éxito de liderazgo +1 / 25% fricción y perder -1)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarMentor()">Aceptar ser su mentor (Transmitir tus galones)</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Rechazarlo: en el fútbol profesional cada uno debe ganarse su puesto</button>
            </div>
          `;
        } else if (azarVet === 2) {
          const exotico = pickRandom(clubesExoticos);
          const modesto = pickRandomExcept(clubesEuropaBajos, player.club);
          const detEx = generarDetalleContrato(exotico);
          const detMod = generarDetalleContrato(modesto);

          htmlOpciones = `
            <div style="background: rgba(148, 163, 184, 0.15); border-left: 4px solid #94a3b8; padding: 14px; margin: 15px 0;">
              ⌛ <strong>RECTA FINAL DE CARRERA: CONTRATOS DE VETERANÍA</strong>
            </div>
            <div class="oferta-card">
              <div class="oferta-header">🌴 Retiro Dorado en ${detEx.club}</div>
              <div class="oferta-detalles">
                • <strong>Duración:</strong> 1 temporada (renovable)<br>
                • <strong>Sueldo estratosférico:</strong> €${detEx.sueldo}M/año | <strong>Prima:</strong> €${detEx.prima}M<br>
                • <strong>Rol:</strong> Franquicia internacional
              </div>
              <button class="btn-opcion" onclick="ejecutarDecision({club: '${detEx.club}'})">Fichar por el <strong>${detEx.club}</strong></button>
            </div>
            <div class="oferta-card">
              <div class="oferta-header">🛡️ Jerarquía en ${detMod.club}</div>
              <div class="oferta-detalles">
                • <strong>Duración:</strong> 1 temporada<br>
                • <strong>Sueldo:</strong> €${detMod.sueldo}M/año<br>
                • <strong>Rol:</strong> Líder de vestuario
              </div>
              <button class="btn-opcion" onclick="ejecutarDecision({club: '${detMod.club}'})">Fichar por el <strong>${detMod.club}</strong></button>
            </div>
            <button class="btn-opcion" onclick="ejecutarDecision({})">Pelear por tu puesto y quedarte en el <strong>${player.club}</strong></button>
          `;
        } else {
          htmlOpciones = `
            <div style="background: rgba(16, 185, 129, 0.15); border-left: 4px solid #10b981; padding: 14px; margin: 15px 0;">
              🥗 <strong>PLAN DE REGENERACIÓN FÍSICA PARA VETERANOS</strong><br>
              A tus ${player.edad} años, te ofrecen un protocolo biológico para cuidar las articulaciones.<br>
              <small style="color: #94a3b8;">(Riesgo: 70% éxito +1 / 30% bajón físico -1)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarRegeneracion()">Someterte al plan regenerativo</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Confiar en tus rutinas de siempre</button>
            </div>
          `;
        }
      }

      container.innerHTML = `
        <h3>💼 Despacho y Decisiones de Futuro</h3>
        <p><strong>Situación:</strong> ${player.nombre} (#${player.dorsal}) | <strong>Edad:</strong> ${player.edad} años | <strong>Posición:</strong> ${player.posicion} (${obtenerSiglasPosicion(player.posicion)}) | <strong>Club actual:</strong> <strong>${player.club}</strong> | <strong>Media:</strong> ${player.media}</p>
        <div style="background: rgba(0, 0, 0, 0.3); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 0.9rem;">
          🏷️ <strong>Valoración de Mercado:</strong> €${player.valorMercado}M | 💵 <strong>Sueldo:</strong> €${player.sueldoAnual}M/año | 🏆 <strong>Valor Récord:</strong> €${player.valorMercadoRecord}M
        </div>
        <p>Tu agente te presenta las opciones antes de saltar a disputar la siguiente etapa:</p>
        <hr>
        ${htmlPeticionPosicion}
        ${htmlOpcionRetiroFutbol}
        ${htmlRetiroSeleccion}
        ${htmlOpciones}
      `;
    }

    function resolverEventoFIFA(deltaMedia, msg) {
      if (deltaMedia !== 0) aplicarDeltaMedia(deltaMedia);
      alert(msg);
      renderDespacho();
    }

    function pedirCambioPosicion(nuevaPos) {
      const tieneJerarquia = player.media >= 80;
      if (tieneJerarquia) {
        player.posicion = nuevaPos;
        aplicarDeltaMedia(1);
        alert(`¡PETICIÓN ACEPTADA! El entrenador respeta tu estatus de estrella y adapta el dibujo táctico para que juegues de ${nuevaPos} (+1 de media).`);
      } else {
        const acepta = (randomInt(1, 100) <= 45);
        if (acepta) {
          player.posicion = nuevaPos;
          actualizarPrimeSiProcede();
          alert(`El míster accede a probarte de ${nuevaPos} en los entrenamientos.`);
        } else {
          aplicarDeltaMedia(-1);
          alert(`PETICIÓN RECHAZADA. El entrenador considera tu petición una falta de humildad táctica: "Aquí juegas donde yo decida" (-1 de media).`);
        }
      }
      renderDespacho();
    }

    function forzarRetirada(motivo) {
      player.retiradoFutbol = true;
      player.motivoRetirada = motivo;
      renderFin();
    }

    function retirarseDeSeleccion() {
      player.retiradoSeleccion = true;
      aplicarDeltaMedia(1);
      alert(`Has anunciado oficialmente tu retirada de la Selección de ${player.nacionalidad}. A partir de ahora te enfocarás 100% en ${player.club}.`);
      renderDespacho();
    }

    function ejecutarDecision(opts) {
      if (opts.club) player.club = opts.club;
      if (opts.mediaDelta) aplicarDeltaMedia(opts.mediaDelta);
      player.edad += (player.modoJuego === 22) ? 1 : 2;
      player.numeroFicha += 1;
      actualizarPrimeSiProcede();
      calcularValorMercado();

      if (player.edad >= 40) {
        forzarRetirada("Límite absoluto alcanzado: Cuelgas las botas a los 40 años como una leyenda viviente del fútbol.");
      } else {
        simularFicha();
      }
    }

    function ejecutarDieta() {
      const exito = (randomInt(1, 100) <= 70);
      if (exito) {
        player.tieneDietaEstricta = true;
        player.desgasteFisicoAcumulado = Math.max(0, player.desgasteFisicoAcumulado - 2);
        ejecutarDecision({mediaDelta: 1});
      } else {
        ejecutarDecision({mediaDelta: -1});
      }
    }

    function ejecutarMentor() {
      const delta = (randomInt(1, 100) <= 75) ? 1 : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarRegeneracion() {
      const delta = (randomInt(1, 100) <= 70) ? 1 : -1;
      player.desgasteFisicoAcumulado = Math.max(0, player.desgasteFisicoAcumulado - 2);
      ejecutarDecision({mediaDelta: delta});
    }

    function copiarResumen(veredictoLimpio) {
      const totTitulos = player.titulosClub + player.titulosSeleccion;
      const texto = `⚽ HISTORIAL DE CARRERA: ${player.nombre} (#${player.dorsal})
🌍 Nacionalidad: ${player.nacionalidad}
🏃 Posición Prime: ${player.posicionPrime} (${obtenerSiglasPosicion(player.posicionPrime)}) · Media Prime: ${player.mediaPrime}
📊 Media de retirada: ${player.media} | Edad de retirada: ${player.edad} años
🏷️ Valor Récord Histórico: €${player.valorMercadoRecord}M
👕 Partidos de club: ${player.partidosTotales} (⚽ ${player.golesTotales}G | 🅰️ ${player.asistenciasTotales}A)
🔵 Internacional: ${player.partidosSeleccion} partidos (${player.golesSeleccion}G | 🅰️ ${player.asistenciasSeleccion}A)
🏆 Títulos Colectivos: ${totTitulos} (Club: ${player.titulosClub} | Selección: ${player.titulosSeleccion} [${player.mundialesGanados} Mundiales, ${player.continentalesGanados} Copas Continentales])
🟡 Ballon d'Or: ${player.balonesDeOro} | 👟 European Golden Shoe: ${player.botasDeOro}
🎖️ Estatus: ${veredictoLimpio}
🛑 Motivo de Retirada: ${player.motivoRetirada || 'Retiro natural al concluir tu ciclo profesional'}
🎮 Modo jugado: ${player.modoJuego === 22 ? '22 Fichas (Anual)' : '11 Fichas (Bianual)'} en Fichas: Carrera de Fútbol`;

      navigator.clipboard.writeText(texto).then(() => {
        alert("¡Resumen de carrera copiado al portapapeles! Ya puedes pegarlo y compartirlo donde quieras.");
      }).catch(() => {
        alert("No se pudo copiar automáticamente. Puedes seleccionar el texto manualmente.");
      });
    }

    function renderFin() {
      const totTitulos = player.titulosClub + player.titulosSeleccion;
      const esAtacante = (player.posicion.includes("Delantero") || player.posicion.includes("Extremo") || player.posicion.includes("Mediapunta"));
      const esDefensa = (player.posicion.includes("Defensa") || player.posicion.includes("Lateral") || player.posicion === "Pivote Defensivo" || player.posicion.includes("Carrilero"));
      const esPortero = (player.posicion === "Portero");

      let veredicto = "";
      let veredictoTexto = "";
      if (player.balonesDeOro >= 2) {
        veredictoTexto = "EL MAYOR DE TODOS LOS TIEMPOS (G.O.A.T.)";
        veredicto = "🐐 <strong>EL MAYOR DE TODOS LOS TIEMPOS (G.O.A.T.):</strong> Múltiples Ballon d'Or te colocan en el Olimpo absoluto del fútbol junto a los más grandes de la historia.";
      } else if (player.balonesDeOro === 1 || player.botasDeOro >= 2 || player.guantesDeOro >= 1 || player.pichichisMundial >= 1) {
        veredictoTexto = "ESTRELLA GENERACIONAL";
        veredicto = "👑 <strong>ESTRELLA GENERACIONAL:</strong> Alcanzaste la cima del planeta y fuiste el líder absoluto de tu época dorada.";
      } else if (totTitulos >= 6) {
        veredictoTexto = "COLECCIONISTA DE COPAS";
        veredicto = "⭐ <strong>COLECCIONISTA DE COPAS:</strong> Un ganador nato que llenó las vitrinas de los clubes por donde pasó.";
      } else {
        veredictoTexto = "CARRERA PROFESIONAL DE ÉLITE";
        veredicto = "⚽ <strong>CARRERA PROFESIONAL DE ÉLITE:</strong> Competiste con honor al máximo nivel internacional.";
      }

      const motivoFinal = player.motivoRetirada || `Retiro definitivo tras completar exitosamente tu trayectoria profesional a los ${player.edad} años.`;
      const cartaUltimateTeamHtml = generarCartaUltimateTeam();

      container.innerHTML = `
        <h1>🏆 Fin de la Carrera Profesional: ${player.nombre}</h1>
        <p>A los <strong>${player.edad} años</strong>, cuelgas las botas definitivamente tras disputar <strong>${player.numeroFicha} etapas</strong> en la élite:</p>

        <h3 style="text-align: center; margin-top: 20px;">🃏 Carta Ultimate Team · Momento Prime</h3>
        ${cartaUltimateTeamHtml}

        <div style="background: rgba(239, 68, 68, 0.15); border-left: 4px solid #ef4444; padding: 12px 16px; border-radius: 6px; margin: 15px 0;">
          📌 <strong>Circunstancia del retiro:</strong> ${motivoFinal}
        </div>

        <div style="background: #1e293b; padding: 20px; border-radius: 8px; margin: 20px 0; line-height: 1.8;">
          <p>• <strong>Nombre:</strong> ${player.nombre} (#${player.dorsal})</p>
          <p>• <strong>Nacionalidad:</strong> ${banderasPaises[player.nacionalidad] || ''} ${player.nacionalidad}</p>
          <p>• <strong>Posición Prime:</strong> ${player.posicionPrime} (${obtenerSiglasPosicion(player.posicionPrime)}) | <strong>Pierna:</strong> ${player.pieHabil}</p>
          <p>• <strong>Media máxima (Prime):</strong> <span style="color: #facc15; font-weight: bold;">${player.mediaPrime} / 99</span> (en ${player.clubPrime} a los ${player.edadPrime} años)</p>
          <p>• <strong>Media final de retirada:</strong> ${player.media} / 99</p>
          <p>• <strong>Valor de Mercado Récord:</strong> <span style="color: #facc15; font-weight: bold;">€${player.valorMercadoRecord}M</span></p>
          <p>• <strong>Partidos oficiales en clubes:</strong> ${player.partidosTotales}</p>
          <p>• <strong>Producción ofensiva de club:</strong> ⚽ ${player.golesTotales} goles | 🅰️ ${player.asistenciasTotales} asistencias</p>
          ${esPortero ? `<p>• <strong>Muro bajo palos:</strong> 🧤 ${player.porteriasCeroTotales} porterías a cero | 🧱 ${player.paradasTotales} paradas totales</p>` : ''}
          ${esDefensa ? `<p>• <strong>Rendimiento defensivo:</strong> 🛡️ ${player.recuperacionesTotales} recuperaciones/entradas | 🧤 ${player.porteriasCeroTotales} porterías a cero</p>` : ''}
          ${(!esPortero && !esDefensa) ? `<p>• <strong>Creación y desborde:</strong> 🔑 ${player.pasesClaveTotales} pases clave | ⚡ ${player.regatesTotales} regates | 🎯 ${player.pasesCompletadosTotales} pases completados</p>` : ''}
          <p>• <strong>Internacional con ${player.nacionalidad}:</strong> ${player.partidosSeleccion} partidos (${player.golesSeleccion} goles, ${player.asistenciasSeleccion} asistencias)${player.retiradoSeleccion ? ' <em>(Retirado de selección a los 30+ años)</em>' : ''}</p>
          <p>• <strong>Total de Títulos Colectivos:</strong> ${totTitulos} (Club: ${player.titulosClub} | Selección: ${player.titulosSeleccion} [${player.mundialesGanados} FIFA World Cup, ${player.continentalesGanados} Torneos Continentales])</p>
          <p>• <strong>Distinciones individuales:</strong> 🟡 ${player.balonesDeOro} Ballon d'Or | 👟 ${player.botasDeOro} European Golden Shoe | 🧤 ${player.guantesDeOro} Yashin Trophy | ⭐ ${player.vecesOnceIdeal} FIFPRO World 11</p>
          ${esAtacante ? `<p>• <strong>Trofeos de Máximo Goleador:</strong> ⚽ ${player.pichichisLiga} Ligas | ⚽ ${player.pichichisChampions} UEFA Champions League | ⚽ ${player.pichichisMundial} FIFA World Cup</p>` : ''}
        </div>

        <h3>🏅 Vitrina de Títulos Colectivos:</h3>
        <div style="margin: 10px 0;">
          ${player.listaTitulos.length ? player.listaTitulos.map(t => `<p>• ${t}</p>`).join('') : '<p><em>No lograste levantar ningún título colectivo en tu carrera.</em></p>'}
        </div>

        <hr>
        <h3>🎖️ Historial de Galardones Individuales:</h3>
        <div style="margin: 10px 0;">
          ${player.listaPremiosIndiv.length ? player.listaPremiosIndiv.map(pr => `<p>• ${pr}</p>`).join('') : '<p><em>No lograste cosechar premios individuales de máxima categoría.</em></p>'}
        </div>

        <hr>
        <h3>Veredicto Histórico:</h3>
        <p style="font-size: 1.05rem; margin: 12px 0;">${veredicto}</p>

        <button class="btn-compartir" onclick="copiarResumen('${veredictoTexto}')">📋 Copiar y Compartir Resumen de Carrera</button>
        <button class="btn-primario" onclick="location.reload()">Jugar una nueva carrera desde cero</button>
      `;
    }

    renderStart();
  </script>
</body>
</html>
